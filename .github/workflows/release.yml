name: Release

# Pushing a version tag (v0.1.6) checks the tagged commit as CI does and packs it once, then uploads
# the package's CDN bundle to cdn.pugs.dev and publishes the same package to npm. Neither can be undone.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  check:
    name: Check and pack the tagged commit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # npm and the CDN path take the version from package.json, whatever the tag says.
      - name: Check the tag matches package.json
        run: |
          version="$(jq -r .version package.json)"
          test "$GITHUB_REF_NAME" = "v$version" \
            || { echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"; exit 1; }

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99 # v1.50.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - run: bun install --frozen-lockfile

      - run: make check-proto-pin ci

      - run: npm pack --pack-destination "$RUNNER_TEMP"

      - name: Check for uncommitted changes
        run: git diff --exit-code

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: ${{ runner.temp }}/*.tgz
          if-no-files-found: error

  # Before npm, whose README links the CDN URL: an early fetch of it caches a 404 at the edge.
  # Neither publish job installs dependencies, so no package code runs beside the R2 or npm token.
  cdn:
    name: Upload the CDN bundle to R2
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: ${{ runner.temp }}/package

      # The bundle inside the npm package, so the CDN serves the bytes npm (and jsDelivr) serve.
      - name: Unpack the CDN bundle from the package
        run: tar -xzf "$RUNNER_TEMP"/package/*.tgz --strip-components=1 package/dist/cdn

      - run: node scripts/publish-cdn.mjs
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

      - name: Summarize the URL and SRI for the release notes
        run: |
          {
            echo '```'
            echo "https://cdn.pugs.dev/$GITHUB_REF_NAME/pug.min.js"
            echo "sha384-$(openssl dgst -sha384 -binary dist/cdn/pug.min.js | base64 -w0)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  npm:
    name: Publish to npm
    needs: cdn
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write # trusted publishing; provenance comes with it
    steps:
      # Trusted publishing needs npm >= 11.5.1, which Node 24 ships.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: ${{ runner.temp }}/package

      # A tarball publish runs no lifecycle scripts; the check job ran them.
      - run: npm publish "$RUNNER_TEMP"/package/*.tgz
