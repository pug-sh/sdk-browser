version: 2
updates:
  # "bun", not "npm": the npm ecosystem updates package-lock/yarn.lock/pnpm-lock, none of which
  # exist here, leaving bun.lock stale and CI's `bun install --frozen-lockfile` failing.
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"

  # ci.yml pins actions by commit sha; without this they would never move again.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
